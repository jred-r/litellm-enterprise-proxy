services:
  litellm-db:
    image: postgres:latest
    environment:
      POSTGRES_DB: litellm_db
      POSTGRES_USER: litellm_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - litellm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm_admin -d litellm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  litellm-cache:
    image: redis:latest
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redisdata:/data
    networks:
      - litellm-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  litellm-proxy:
    depends_on:
      litellm-db:
        condition: service_healthy
      litellm-cache:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
