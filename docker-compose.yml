services:
  litellm-proxy:
    image: ghcr.io/berriai/litellm:v1.104.6
    volumes:
      - ./config/litellm-config.yaml:/app/config.yaml:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://litellm_admin:${DB_PASSWORD}@litellm-db:5432/litellm_db?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@litellm-cache:6379/0}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Set LITELLM_SALT_KEY in .env}
      LITELLM_MODE: PRODUCTION
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - litellm-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    ports:
      - "8000:8000"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      litellm-proxy:
        condition: service_healthy
    networks:
      - litellm-network
    restart: unless-stopped

networks:
  litellm-network:
    driver: bridge
